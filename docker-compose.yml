services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: wess
      POSTGRES_USER: wess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wess_secret_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wess -d wess"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wess-network
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run

  wess-backend:
    build:
      context: ../wess-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://wess:${POSTGRES_PASSWORD:-wess_secret_2024}@postgres:5432/wess?sslmode=disable
      PORT: "8080"
      APP_ENV: production
      CORS_ALLOWED_ORIGINS: "https://wess.jsprd.io"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wess-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  wess-frontend:
    build:
      context: ../wess
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    depends_on:
      - wess-backend
    networks:
      - wess-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  webhook:
    build:
      context: ./webhook
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/jsprd/dev/projects/repos:/repos
    networks:
      - wess-network
    security_opt:
      - no-new-privileges:true

  auto-tle:
    build:
      context: ../AutoTLE
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: postgres://wess:${POSTGRES_PASSWORD:-wess_secret_2024}@postgres:5432/wess?sslmode=disable
      ENV: do
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wess-network
    profiles:
      - sync
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - wess-frontend
      - wess-backend
      - webhook
    networks:
      - wess-network
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID

volumes:
  postgres_data:

networks:
  wess-network:
    driver: bridge
